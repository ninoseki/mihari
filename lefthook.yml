pre-commit:
  commands:
    rubocop:
      glob: "*.rb"
      run: bundle exec rubocop --fix {staged_files}
      stage_fixed: true
    oxlint:
      root: "frontend/"
      glob: "*.{js,ts,vue}"
      run: npx oxlint --fix {staged_files}
      stage_fixed: true
    oxfmt:
      root: "frontend/"
      glob: "*.{js,ts,vue}"
      run: npx oxfmt --write {staged_files}
      stage_fixed: true
    type-check:
      root: "frontend/"
      glob: "*.{js,ts,vue}"
      run: npm run type-check
    actionlint:
      glob: ".github/workflows/*.{yaml,yml}"
      run: actionlint {staged_files}
