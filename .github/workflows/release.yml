name: Release gem

on:
  release:
    types: ["created"]

jobs:
  gem-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: 3.4
          bundler: latest
          bundler-cache: true
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Configure NPM
        # Disable audit to improve the build performance
        run: npm set audit false
      - uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1

  image-release:
    runs-on: ubuntu-latest
    needs: gem-release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Strip v prefix
        run: |
          TAG="${{ github.event.release.tag_name }}"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Build Docker image
        run: |
          docker build . \
          --tag "ghcr.io/$GITHUB_ACTOR/mihari:latest" \
          --tag "ghcr.io/$GITHUB_ACTOR/mihari:${{ env.VERSION }}" \
          --build-arg VERSION=${{ env.VERSION }}
      - name: Push Docker image
        run: |
          docker push "ghcr.io/$GITHUB_ACTOR/mihari:latest"
          docker push "ghcr.io/$GITHUB_ACTOR/mihari:${{ env.VERSION }}"
